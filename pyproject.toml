[project]
name = "distill"
version = "0.1.0"
description = "Distil a frontier model's labels into a small student, and find the volume where owning it beats renting"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy==2.4.6", "scikit-learn==1.9.1", "onnxruntime==1.30.0", "tokenizers==0.23.2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["distill"]

[tool.setuptools.package-data]
distill = ["prices.yaml"]
